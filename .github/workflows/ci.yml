name: CI

# Kör vid varje push och PR mot main. Kör install, lint, typecheck, test
# och hela produktionsbygget så att även statisk SEO, V2-bansidor och sitemap verifieras.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm CLI kraschar för närvarande reproducerbart med "Exit handler never called"
      # på GitHub-runnern. Behåll package-lock.json som källa och importera dess
      # versionsval till en tillfällig pnpm-lock för just CI-installationen.
      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Import npm lockfile
        run: pnpm import

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true # Lint-regler skärps stegvis — bryt inte CI än.

      - name: Typecheck
        run: pnpm exec tsc --noEmit
        continue-on-error: true # Typecheck skärps stegvis. Vi vill se rapporten utan att stoppa CI initialt.

      - name: Hardcoded color scan
        env:
          HARDCODED_COLOR_THRESHOLD: '265'
        run: pnpm check:colors:strict
        continue-on-error: true

      - name: Test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITE_SUPABASE_PROJECT_ID: test-project
        run: pnpm test

      - name: Full production build + static SEO
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: pnpm build

      - name: Verify public V2 course SEO output
        shell: bash
        run: |
          test -f dist/banplanerare/index.html
          test -f dist/banor/index.html
          test -f dist/banor/sv_agility_1_balans_01/index.html
          test -f dist/banor/sv_hopp_3_fart_01_mirror/index.html
          test -f dist/banor/noll_2026_slalom_15x30/index.html
          test -f dist/banor/noll_2026_balans_25x30_mirror/index.html
          test -f dist/banor/hoopers_1_basic/index.html

          # /banor-index ska länka vidare till riktiga V2-kartor.
          grep -q "noll_2026_slalom_15x30" dist/banor/index.html
          grep -q "sv_agility_3_master_01_mirror" dist/banor/index.html

          # Gamla URL:er ska fortfarande fungera, men canonical pekar på V2-id:t.
          test -f dist/banor/klass-1-agility-grundflyt/index.html
          grep -q "https://agilitymanager.se/banor/sv_agility_1_balans_01" dist/banor/klass-1-agility-grundflyt/index.html

          # Bara de nya V2-id:na skickas till sitemap; /banor är indexets nav.
          grep -q "<loc>https://agilitymanager.se/banor</loc>" dist/sitemap-pages.xml
          grep -q "sv_agility_1_balans_01" dist/sitemap-pages.xml
          grep -q "noll_2026_slalom_15x30" dist/sitemap-pages.xml
          grep -q "hoopers_1_basic" dist/sitemap-pages.xml
          ! grep -q "klass-1-agility-grundflyt" dist/sitemap-pages.xml

          grep -q "25 färdiga kartor" dist/index.html
          echo "Static V2 planner/course SEO output verified."
