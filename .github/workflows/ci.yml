name: CI

# Kör vid varje push och PR mot main. Kör install, lint, typecheck, test
# och build så att vi fångar regressioner innan de når produktion.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm CLI kraschar för närvarande reproducerbart med "Exit handler never called"
      # på GitHub-runnern. Behåll package-lock.json som källa och importera dess
      # versionsval till en tillfällig pnpm-lock för just CI-installationen.
      - name: Enable pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Import npm lockfile
        run: pnpm import

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true # Lint-regler skärps stegvis — bryt inte CI än.

      - name: Typecheck
        run: pnpm exec tsc --noEmit
        continue-on-error: true # Typecheck skärps stegvis. Vi vill se rapporten utan att stoppa CI initialt.

      - name: Hardcoded color scan
        env:
          HARDCODED_COLOR_THRESHOLD: '265'
        run: pnpm check:colors:strict
        continue-on-error: true

      - name: Test
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
          VITE_SUPABASE_PROJECT_ID: test-project
        run: pnpm test

      - name: Build (no static prerender)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: pnpm build:no-snap
