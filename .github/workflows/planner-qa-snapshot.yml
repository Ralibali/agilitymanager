name: Verify reconciled planner reliability
on:
  push:
    branches: [fix/planner-reliability-20260906]
    paths: [.github/workflows/planner-qa-snapshot.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact patch and reconcile delayed implementation
        run: |
          git diff --exit-code d0ebc6432c53b2d787630291e9fccdc904e9dacd HEAD -- src scripts .gitignore .github/workflows/planner-ci.yml
          cat .planner-fix/part* > /tmp/planner.patch
          echo '08fd4014fbf71480b7e02780068c74257de9bd9cfff48073364dc8448387ab90  /tmp/planner.patch' | sha256sum -c
          git apply --check --unidiff-zero /tmp/planner.patch
          git apply --unidiff-zero /tmp/planner.patch
          python3 .planner-fix/reconcile.py
          python3 .planner-fix/finalize.py
          python3 .planner-fix/ci-finish.py
          python3 .planner-fix/pdf-finish.py
          python3 .planner-fix/pdf-labels.py
          python3 .planner-fix/latest-main.py
          python3 .planner-fix/pdf-rules-consistency.py
          tar --exclude=.git --exclude='.env*' --exclude=node_modules --exclude='.planner-fix' --exclude='*.log' -czf /tmp/planner-review.tar.gz .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Both full regression suites
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install pinned browser test dependencies
        run: |
          pip install -r scripts/planner-browser-requirements.txt
          python -m playwright install --with-deps chromium
          npx playwright install --with-deps chromium
      - name: Original desktop and mobile browser suite
        run: npm run test:e2e
      - name: Extended desktop and mobile browser regressions
        if: success() || failure()
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/planner-dev.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/ > /dev/null && break; sleep 1; done
          python scripts/planner-browser-check.py
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-browser-evidence
          path: |
            qa-artifacts/
            test-results/
            /tmp/planner-dev.log
            /tmp/planner-review.tar.gz
          retention-days: 7
      - name: Commit verified implementation to test branch only
        run: |
          git rm -r .planner-fix .github/workflows/planner-qa-snapshot.yml
          git add src scripts e2e package.json package-lock.json bun.lock playwright.config.ts .gitignore .github/workflows/planner-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(planner): reconcile tunnel geometry, rules roundtrip, reliable save and undo'
          git log -1 --format='VERIFIED_COMMIT=%H%nVERIFIED_TREE=%T'
          git push origin HEAD:fix/planner-reliability-20260906
