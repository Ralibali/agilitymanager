name: Planner QA workspace
on:
  push:
    branches: [fix/planner-reliability-20260906]
    paths: [.github/workflows/planner-qa-snapshot.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Package isolated QA source and locked dependencies
        run: tar --exclude=.git --exclude='.env*' --exclude='*.log' --exclude='.vercel' -czf /tmp/planner-qa.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: planner-qa-workspace
          path: /tmp/planner-qa.tar.gz
          retention-days: 1
